name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "image/**"
      - "Tutorial/**"
      - "CookBook.pdf"
  pull_request:
    paths-ignore:
      - "**.md"
      - "image/**"
      - "Tutorial/**"
      - "CookBook.pdf"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 xvfb xauth
      - name: Install DriftlessMap
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q driftlessmap tests
      - name: Run regression suite
        env:
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: software
        run: xvfb-run -a python tests/run_test_suite.py pytest

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff==0.12.4 "mypy>=1.10" numpy
      - run: ruff check .
      - name: Type-check the scientific core
        run: mypy
      - name: Agent guides are identical
        run: cmp AGENTS.md CLAUDE.md
