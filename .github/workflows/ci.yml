name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxcb-cursor0 xvfb xauth
      - name: Install DriftlessMap
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q driftlessmap tests
      - name: Run regression suite
        env:
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: software
        run: xvfb-run -a python -m unittest discover -s tests -v

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff==0.12.4
      - run: ruff check driftlessmap tests setup.py
