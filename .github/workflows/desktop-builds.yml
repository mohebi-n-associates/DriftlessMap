name: Build desktop applications

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: ./packaging/build_windows.ps1
            artifact: dist/DriftlessMap-*-Windows-x64.zip
            artifact_name: DriftlessMap-Windows-x64
          - name: macOS
            os: macos-14
            command: ./packaging/build_macos.sh
            artifact: dist/DriftlessMap-*-macOS.dmg
            artifact_name: DriftlessMap-macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build native desktop application
        shell: pwsh
        if: runner.os == 'Windows'
        run: ${{ matrix.command }}

      - name: Build native desktop application
        shell: bash
        if: runner.os == 'macOS'
        run: ${{ matrix.command }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach installer to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" ${{ matrix.artifact }} --clobber
