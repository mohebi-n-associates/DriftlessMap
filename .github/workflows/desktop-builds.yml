name: Build desktop applications

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  desktop:
    name: ${{ matrix.name }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: ./packaging/build_windows.ps1
            artifact: dist/DriftlessMap-*-Windows-x64.zip
            artifact_name: DriftlessMap-Windows-x64
          - name: macOS Apple Silicon
            os: macos-14
            command: ./packaging/build_macos.sh
            artifact: dist/DriftlessMap-*-macOS-arm64.dmg
            artifact_name: DriftlessMap-macOS-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      # Signing runs only when the maintainers have configured the secrets;
      # otherwise unsigned bundles are produced, as before.
      - name: Build native desktop application
        shell: pwsh
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ${{ matrix.command }}

      - name: Build native desktop application
        shell: bash
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ${{ matrix.command }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  attach:
    name: Attach installers to the release
    if: github.event_name == 'release'
    needs: desktop
    runs-on: ubuntu-latest
    # Only this job, which runs no build code, may write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          merge-multiple: true
      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          installers/* --clobber --repo "${{ github.repository }}"
